name: Deploy BNU_math to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build resource catalog
        run: python scripts/build_catalog.py
      - name: Package website with same-origin PDFs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil
          
          root = pathlib.Path('.')
          site = root / '_site'
          site.mkdir(exist_ok=True)
          for name in ('index.html', 'catalog.json'):
              shutil.copy2(root / name, site / name)
          for entry in json.loads((root / 'catalog.json').read_text(encoding='utf-8')):
              path = pathlib.PurePosixPath(entry['path'])
              if path.suffix.lower() != '.pdf':
                  continue
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in {'考试题目', '教材答案', '其他资料'}:
                  raise ValueError('Invalid resource path: ' + str(path))
              source = root / path
              with source.open('rb') as stream:
                  if stream.read(5) != b'%PDF-':
                      raise ValueError('Not a PDF or unresolved LFS pointer: ' + str(path))
              target = site / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          total = sum(p.stat().st_size for p in site.rglob('*') if p.is_file())
          if total >= 950_000_000:
              raise ValueError('Pages artifact exceeds the 950 MB project budget')
          print(f'Packaged website and PDF files: {total / 1_000_000:.1f} MB')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
